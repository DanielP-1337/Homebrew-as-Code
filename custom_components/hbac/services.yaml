state:
  name: Read list and status
  description: Read list and status
  fields:
    entry_id: &id001
      name: HBAC
      required: false
      selector:
        config_entry:
          integration: hbac
catalog:
  name: Load list from Brewfather
  description: Load list from Brewfather
  fields:
    entry_id: *id001
    kind: &id002
      name: Source
      required: true
      selector:
        select:
          options:
          - recipes
          - batches
    refresh:
      name: Refresh cache
      default: false
      selector:
        boolean: {}
preview:
  name: Fetch and preview
  description: Fetch and preview
  fields:
    entry_id: *id001
    kind: *id002
    source_id:
      name: Recipe/batch ID (direct entry supported)
      required: true
      selector:
        text: {}
    mash_in:
      name: 'Mash-in temperature °C – blank: first rest'
      selector:
        number:
          min: 20
          max: 80
          step: 1
          unit_of_measurement: °C
          mode: box
    boil_temperature:
      name: Boil temperature °C
      default: 103
      selector:
        number:
          min: 95
          max: 105
          step: 1
          unit_of_measurement: °C
          mode: box
add:
  name: Reviewed · Add to upload list
  description: Reviewed · Add to upload list
  fields:
    entry_id: *id001
    preview_id:
      name: Preview ID
      required: true
      selector:
        text: {}
    revision: &id003
      name: Current list revision
      required: true
      selector:
        text: {}
remove:
  name: Remove
  description: Remove
  fields:
    entry_id: *id001
    index: &id004
      name: List index (0–8)
      required: true
      selector:
        number:
          min: 0
          max: 8
          step: 1
          mode: box
    revision: *id003
move:
  name: Move list slot
  description: Move list slot
  fields:
    entry_id: *id001
    index: *id004
    target:
      name: Target index (0–8)
      required: true
      selector:
        number:
          min: 0
          max: 8
          step: 1
          mode: box
    revision: *id003
clear:
  name: Clear local list
  description: Clear local list
  fields:
    entry_id: *id001
    revision: *id003
readiness:
  name: Check device readiness
  description: Check device readiness
  fields:
    entry_id: *id001
upload:
  name: Replace all device slots
  description: Uploading replaces ALL recipes on the device with this list in the
    displayed order.
  fields:
    entry_id: *id001
    revision: *id003
    replace_all:
      name: I have reviewed the list and want to replace all device slots.
      required: true
      selector:
        boolean: {}
status:
  name: Check job status again
  description: Check job status again
  fields:
    entry_id: *id001
acknowledge_unknown:
  name: Device checked, job ended · Unlock
  description: Use only after checking the device and Bridge and confirming no job
    is running. An interrupted upload can leave an incomplete recipe list.
  fields:
    entry_id: *id001
    device_checked:
      name: No upload is running and you checked the device manually? This does not
        send a recipe.
      required: true
      selector:
        boolean: {}
