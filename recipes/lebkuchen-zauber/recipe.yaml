  total_l: 28.0
  mash_l: 23.0
  sparge_l: 5.0
  salts_g:
    calcium_chloride_dihydrate: 5.0
    calcium_sulfate_dihydrate: 3.0
  target_mash_ph_at_20c: [5.35, 5.45]
packaging:
  type: keg
  carbonation: forced
  carbonation_volumes: 2.2
